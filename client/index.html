<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тусгай Чат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Нэвтрэх цонх -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>Тусгай Чат</h2>
            <p>Та хэрэглэгчийн тал болон нууц үгээ сонгоно уу</p>
            
            <div class="role-selector">
                <label>
                    <input type="radio" name="userRole" value="m" checked> М Тал
                </label>
                <label>
                    <input type="radio" name="userRole" value="o"> О Тал
                </label>
            </div>

            <input type="password" id="passwordInput" class="login-input" placeholder="Нууц үг...">
            <button id="loginBtn" class="login-btn">Нэвтрэх</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <!-- 2. Чатын Үндсэн Дэлгэц -->
    <div class="chat-app">
        <div class="chat-header">
            <div>
                <h3 id="chatTitle">М & О Талын Чат</h3>
                <span id="statusBadge" class="status-badge">Холбогдож байна...</span>
            </div>
        </div>
        
        <div id="messages" class="messages-container"></div>

        <div class="input-container">
            <label for="imageInput" class="image-upload-btn" title="Зураг илгээх">📷</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            
            <input type="text" id="messageInput" class="chat-input" placeholder="Мессеж бичих..." autocomplete="off">
            <button id="sendBtn" class="send-btn">Илгээх</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
