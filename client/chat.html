<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivateChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        
        <!-- Цаг агаар / мэндчилгээ харуулах хэсэг -->
        <div class="chat-header">
            <div id="chat-greeting">☀️ Өдрийн мэнд!</div>
        </div>

        <!-- Мессежүүд гарах хэсэг -->
        <div id="messages" class="chat-messages"></div>

        <!-- Мессеж бичих болон илгээх хэсэг -->
        <div class="chat-input-area">
            <label for="imageInput" class="image-upload-btn" title="Зураг илгээх">📷</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            
            <input type="text" id="messageInput" placeholder="Мессеж бичих...">
            <button id="sendBtn">➤</button>
        </div>

    </div>

    <!-- Socket.IO болон Клиент скрипт холбох -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>
</html>
