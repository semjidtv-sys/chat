<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-box">
        <div class="chat-header">
            <h2>Private Chat</h2>
            <p id="currentUserDisplay"></p>
        </div>
        
        <div class="user-select-group">
            <label for="users">Чаталж буй хэрэглэгч:</label>
            <select id="users"></select>
        </div>

        <div id="messages"></div>

        <div class="input-group">
            <input id="message" placeholder="Мессежээ бичнэ үү..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Илгээх</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>
</html>
